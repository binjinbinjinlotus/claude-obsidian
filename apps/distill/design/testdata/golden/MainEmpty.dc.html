<!-- golden: page, width 1200, title Queue · all caught up (queue folder path) -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Distill — Queue (all caught up)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./ds/distill/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:"DM Sans",-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--primary)}a:hover{color:#1858C4}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1200px; height: 760px; isolation: isolate"><div style="position: absolute; inset: 0; z-index: -1"><dc-import name="WindowShell" layer="frame" width="1200" height="760" hint-size="1200px,760px"></dc-import></div><div style="position: absolute; left: 38px; top: 36px; z-index: 2"><dc-import name="WindowShell" layer="controls" hint-size="52px,12px"></dc-import></div>
<div style="position: absolute; left: 20px; top: 20px; right: 20px; bottom: 20px; display: flex; border-radius: 16px; overflow: hidden; background: var(--window)">

<div style="width: 220px; height: 720px; flex-shrink: 0"><dc-import name="Sidebar" section="queue" queue-count="0" height="720" hint-size="220px,720px"></dc-import></div>

<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 26px; padding: 34px 44px; min-width: 0; box-sizing: border-box">
<header style="display: flex; align-items: flex-start; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.03em; line-height: 1.05">All caught up</h1>
<span style="font-size: 15px; color: var(--muted)">Next batch at <strong style="color: var(--ink); font-weight: 600">5:30 AM</strong> · every 2 hours</span><div style="display: flex; align-items: center; gap: 2px; flex-wrap: wrap"><dc-import name="QueuePath" path="~/Documents/Distill Queue/Research" hint-size="430px,28px"></dc-import><dc-import name="QueueRefresh" state="nothing" hint-size="300px,26px"></dc-import></div>
</div>
<dc-import name="PrimaryButton" title="Process now" system-image="play" size="regular" hint-size="144px,40px"></dc-import>
</header>

<div style="display: flex; align-items: center; gap: 30px; padding: 28px 34px; border-radius: 24px; background: var(--panel)">
<svg width="104" height="124" viewBox="0 0 104 124" aria-hidden="true" style="flex-shrink: 0">
<defs><clipPath id="heroFlask"><path d="M38 8h28v34l30 56a12 12 0 0 1-10.6 17.6H18.6A12 12 0 0 1 8 98l30-56z"></path></clipPath></defs>
<path d="M38 8h28v34l30 56a12 12 0 0 1-10.6 17.6H18.6A12 12 0 0 1 8 98l30-56z" style="fill: var(--window)"></path>
<g clip-path="url(#heroFlask)">
<rect x="0" y="72" width="104" height="60" style="fill: var(--lime)"></rect>
<path d="M0 74c10-6 21 6 32 0s21-6 32 0 21 6 40 0v-6H0z" fill="#D9FFA3"></path>
</g>
<circle cx="44" cy="58" r="4" style="fill: var(--primary)"></circle>
<circle cx="58" cy="46" r="3" fill="#FF9A6B"></circle>
<circle cx="50" cy="32" r="2.2" fill="#5FC8F5"></circle>
<path d="M38 8h28v34l30 56a12 12 0 0 1-10.6 17.6H18.6A12 12 0 0 1 8 98l30-56z" fill="none" stroke-width="2.6" stroke-linejoin="round" style="stroke: var(--flaskLine)"></path>
<rect x="33" y="3" width="38" height="8" rx="4" style="fill: var(--flaskLine)"></rect>
</svg>
<div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: -0.01em">Drop anything here</span>
<span style="font-size: 14px; color: var(--muted); line-height: 1.5">Files, PDFs and screenshots. Paste with <kbd style="font-family: inherit; font-weight: 600; font-size: 12px; padding: 2px 7px; border-radius: 6px; background: var(--window); box-shadow: 0 0 0 1px var(--border)">⌘V</kbd>. They wait here and go into your vault together.</span>
</div>
<dc-import name="SoftButton" title="Choose files" size="regular" tint="var(--ink)" fill="var(--window)" stroke="var(--border)" hint-size="136px,40px"></dc-import>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{files}}" as="f" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 14px">
<dc-import name="Tile" text="{{f.ext}}" fill="{{f.tint}}" ink="{{f.ink}}" hint-size="40px,40px"></dc-import>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span style="font-size: 14px; font-weight: 600">{{f.name}}</span>
<span style="font-size: 12px; color: var(--muted)">{{f.meta}}</span>
<sc-if value="{{f.hasLabels}}" hint-placeholder-val="{{ false }}">
<span style="display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap">
<svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true" style="fill: var(--limeInk)"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
<span style="font-size: 11px; font-weight: 700; color: var(--muted)">Suggested by Haiku</span>
<sc-for list="{{f.labels}}" as="l" hint-placeholder-count="3">
<dc-import name="LabelChip" label-name="{{l.name}}" style="{{l.style}}" removable="true" hint-size="199px,26px"></dc-import>
</sc-for>
<button type="button" style="height: 26px; padding: 0 8px; border: none; background: transparent; color: var(--primary); font-size: 12px; font-weight: 600">Accept all</button>
</span>
</sc-if>
</span>
<span title="{{f.tip}}" style="display: inline-flex; flex-shrink: 0"><dc-import name="Pill" text="{{f.state}}" fill="{{f.stateBg}}" ink="{{f.stateFg}}" hint-size="110px,24px"></dc-import></span>
<dc-import name="IconButton" system-image="xmark" size="30" tint="var(--faint)" help="Remove from queue" hint-size="30px,30px"></dc-import>
</div>
</sc-for>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
renderVals() {
return {
files: [
]
};
}
}
</script>
</body>
</html>
