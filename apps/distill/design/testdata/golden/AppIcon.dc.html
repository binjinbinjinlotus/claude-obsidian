<!-- golden: legacy, width 760, title App icon -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Distill — App icon</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./ds/distill/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=DM+Sans:wght@400;600&amp;display=swap">
<style>
body{margin:0;font-family:"DM Sans",-apple-system,sans-serif;color:#1D1C1A;-webkit-font-smoothing:antialiased}
</style>
</helmet>
<div style="width: 760px; height: 400px; box-sizing: border-box; padding: 32px 40px; background: #F6F5F2; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: baseline; gap: 12px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em">App icon</span>
<span style="font-size: 13px; color: #6B6862">Dock, Finder and Spotlight · replaces the blank placeholder</span>
</div>
<div style="display: flex; align-items: flex-end; gap: 44px">
<sc-for list="{{sizes}}" as="s" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="width: {{s.px}}; height: {{s.px}}; border-radius: {{s.radius}}; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(29,28,26,0.06), 0 {{s.shadowY}} {{s.shadowBlur}} rgba(29,28,26,0.18); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative">
<div style="position: absolute; inset: 0; background: #E3EEFF; clip-path: circle(62% at 50% 118%)"></div>
<svg width="{{s.flask}}" height="{{s.flask}}" viewBox="0 0 40 44" aria-hidden="true" style="position: relative">
<defs><clipPath id="{{s.clip}}"><path d="M15 3h10v12l11 19a5 5 0 0 1-4.3 7.5H8.3A5 5 0 0 1 4 34l11-19z"></path></clipPath></defs>
<path d="M15 3h10v12l11 19a5 5 0 0 1-4.3 7.5H8.3A5 5 0 0 1 4 34l11-19z" fill="#FFFFFF"></path>
<g clip-path="url(#{{s.clip}})"><rect x="0" y="25" width="40" height="20" fill="#B9F06A"></rect><path d="M0 26c4-2 8 2 12 0s8-2 12 0 8 2 16 0v-3H0z" fill="#D9FFA3"></path></g>
<circle cx="18" cy="20" r="1.8" fill="#1F6FEB"></circle>
<circle cx="22.5" cy="15.5" r="1.3" fill="#FFB894"></circle>
<path d="M15 3h10v12l11 19a5 5 0 0 1-4.3 7.5H8.3A5 5 0 0 1 4 34l11-19z" fill="none" stroke="#6B7785" stroke-width="2.2" stroke-linejoin="round"></path>
<rect x="12.5" y="1" width="15" height="4" rx="2" fill="#6B7785"></rect>
</svg>
</div>
<span style="font-size: 12px; color: #6B6862">{{s.label}}</span>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":400}}'>
class Component extends DCLogic {
renderVals() {
const mk = (n, label, clip) => ({ px: n + 'px', radius: Math.round(n * 0.225) + 'px', flask: Math.round(n * 0.62), shadowY: Math.max(1, Math.round(n * 0.04)) + 'px', shadowBlur: Math.max(2, Math.round(n * 0.1)) + 'px', label, clip });
return { sizes: [mk(200, 'Dock · 512', 'i1'), mk(96, 'Finder · 128', 'i2'), mk(48, 'List · 64', 'i3'), mk(24, 'Menu · 32', 'i4')] };
}
}
</script>
</body>
</html>
