<!-- golden: states, width 960, title QuickSourceButton · states -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick source button states</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./ds/distill/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0;font-family:"DM Sans",-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}</style>
</helmet>
<div style="width: 960px; height: 210px; box-sizing: border-box; background: var(--panel); overflow: hidden">
<div data-measure style="padding: 30px 36px 36px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em">QuickSourceButton</span>
<span style="font-size: 13px; color: var(--muted); line-height: 1.5; max-width: 1100px">QuickNote.swift → <b>QuickSourceButton</b>. “+ Source” in the quick note footer; becomes the chosen source (green, ▾). Props: source.</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 24px"><div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-start"><span style="font-size: 12px; font-weight: 700">No source</span><dc-import name="QuickSourceButton"  hint-size="70px,24px"></dc-import><span style="font-size: 11px; color: var(--muted); line-height: 1.45; max-width: 260px">a fresh quick note</span></div><div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-start"><span style="font-size: 12px; font-weight: 700">Chosen</span><dc-import name="QuickSourceButton" source="In person" hint-size="90px,24px"></dc-import></div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":210}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
