<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Distill — Write a note</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:"DM Sans",-apple-system,sans-serif;color:#1D1C1A;-webkit-font-smoothing:antialiased}
a{color:#1F6FEB}a:hover{color:#1858C4}
button,input,textarea{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1200px; height: 760px; isolation: isolate"><div style="position: absolute; inset: 0; z-index: -1"><dc-import name="WindowShell" layer="frame" width="1200" height="760" hint-size="1200px,760px"></dc-import></div><div style="position: absolute; left: 38px; top: 36px; z-index: 2"><dc-import name="WindowShell" layer="controls" hint-size="52px,12px"></dc-import></div>
<div style="position: absolute; left: 20px; top: 20px; right: 20px; bottom: 20px; display: flex; border-radius: 16px; overflow: hidden; background: #FFFFFF">

<div style="width: 220px; height: 720px; flex-shrink: 0"><dc-import name="Sidebar" section="queue" height="720" review-count="0" hint-size="220px,720px"></dc-import></div>

<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 30px 44px 26px; min-width: 0; box-sizing: border-box">
<header style="display: flex; align-items: center; gap: 16px">
<h1 style="margin: 0; flex-grow: 1; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.03em">Add to your vault</h1>
<div aria-label="Add mode" style="display: flex; padding: 4px; border-radius: 20px; background: #F6F5F2">
<span aria-pressed="false" style="display: inline-flex; flex-shrink: 0; text-decoration: none; "><dc-import name="SoftButton" title="Drop files" size="small" tint="#6B6862" fill="transparent" hint-size="100px,30px"></dc-import></span>
<span aria-pressed="true" style="display: inline-flex; flex-shrink: 0; text-decoration: none; "><dc-import name="SoftButton" title="Write a note" size="small" tint="#1D1C1A" fill="#FFFFFF" hint-size="114px,30px"></dc-import></span>
</div>
</header>

<section style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 22px 26px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 0 0 1.5px #ECEAE5, 0 10px 30px rgba(29,28,26,0.05); min-height: 0">
<label for="noteTitle" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Title</label>
<input id="noteTitle" type="text" value="Kettle settings for the new tea set" style="border: none; outline: none; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 22px; color: #1D1C1A; padding: 0; cursor: text">
<dc-import name="MarkdownStyleBar" variant="full" image="true" hint-size="560px,34px"></dc-import>
<label for="noteBody" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Note</label>
<textarea id="noteBody" rows="2" style="border: none; outline: none; resize: none; font-size: 15px; line-height: 1.6; color: #2A2925; padding: 0; cursor: text">The gooseneck kettle has presets. 80 °C works for sencha; I set 60 °C for the gyokuro the shop recommended. The shop's brewing card:</textarea>
<div style="display: flex; flex-direction: column; gap: 10px"><div style="position: relative; width: 380px; height: 116px; border-radius: 10px; overflow: hidden; background: #E3EEFF; box-shadow: 0 0 0 1px rgba(29,28,26,.06)"><div style="position: absolute; left: 16px; top: 14px; right: 16px; display: flex; flex-direction: column; gap: 6px"><span style="font: 800 13px 'Bricolage Grotesque', sans-serif; color: #1F3B6E">Gyokuro brewing card</span><span style="height: 7px; width: 88%; border-radius: 4px; background: rgba(31,59,110,.18)"></span><span style="height: 7px; width: 70%; border-radius: 4px; background: rgba(31,59,110,.18)"></span><span style="height: 7px; width: 80%; border-radius: 4px; background: rgba(31,59,110,.18)"></span><span style="height: 7px; width: 55%; border-radius: 4px; background: rgba(31,59,110,.18)"></span><span style="height: 7px; width: 64%; border-radius: 4px; background: rgba(31,59,110,.18)"></span></div><div style="position: absolute; right: 8px; top: 8px; display: flex; gap: 6px"><dc-import name="PrimaryButton" title="Extract content" system-image="sparkles" size="mini" hint-size="137px,26px"></dc-import><span title="Remove image" style="width: 26px; height: 26px; border-radius: 13px; background: rgba(255,255,255,.95); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(29,28,26,.15)"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></div><span style="position: absolute; left: 8px; bottom: 8px; height: 20px; display: flex; align-items: center; padding: 0 8px; border-radius: 10px; background: rgba(255,255,255,.92); font-size: 10px; font-weight: 700; color: #48463F">brewing-card.png · 412 KB</span></div><div style="font-size: 15px; line-height: 1.55; color: #2A2925">Tasting setup:</div><div style="position: relative; width: 220px; height: 78px; border-radius: 10px; overflow: hidden; background: #DDF2FF; box-shadow: 0 0 0 1px rgba(29,28,26,.06)"><div style="position: absolute; inset: 0; background: linear-gradient(160deg, #DDF2FF 0 45%, #CDEBC0 45% 100%)"></div><span style="position: absolute; left: 30%; bottom: 18%; width: 34%; height: 30%; border-radius: 50% 50% 12px 12px; background: #F4E3C3"></span></div></div>

<div style="margin-top: auto; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #F6F5F2">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 58px; flex-shrink: 0; font-size: 12px; font-weight: 700; color: #6B6862">Source</span>
<button type="button" aria-pressed="true" style="height: 28px; display: flex; align-items: center; gap: 5px; padding: 0 10px; border: none; border-radius: 14px; background: #E3EEFF; color: #1F6FEB; font-size: 12px; font-weight: 700">Discussion
<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#1F6FEB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
<sc-for list="{{channels}}" as="c" hint-placeholder-count="6">
<button type="button" aria-pressed="{{c.on}}" style="height: 28px; padding: 0 10px; border: none; border-radius: 14px; font-size: 12px; font-weight: 600; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}</button>
</sc-for>
<label style="flex-grow: 1; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 0 0 1px #ECEAE5">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9B978F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>
<input type="text" aria-label="Link, channel or person" value="#tea-club · with Mei" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 12px; color: #1D1C1A; cursor: text">
</label>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 58px; flex-shrink: 0; font-size: 12px; font-weight: 700; color: #6B6862">Labels</span>
<svg width="12" height="12" viewBox="0 0 24 24" fill="#9B978F" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
<span style="font-size: 12px; color: #6B6862">Suggested from the note's text and images after you add it to the queue.</span>
</div>
</div>


</section>

<footer style="display: flex; align-items: center; gap: 12px">
<span style="font-size: 13px; color: #6B6862; flex-grow: 1">One note · 2 images. Labels are suggested once it is queued.</span>
<dc-import name="SoftButton" title="Discard" size="regular" tint="#1D1C1A" fill="#F6F5F2" hint-size="96px,40px"></dc-import>
<dc-import name="PrimaryButton" title="Add to queue" system-image="plus" size="regular" hint-size="152px,40px"></dc-import>
</footer>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
renderVals() {
const on = '#1F6FEB', onInk = '#FFFFFF', off = 'transparent', offInk = '#6B6862';
const ch = (label, active) => ({ label, on: active ? 'true' : 'false', bg: active ? '#1F6FEB' : '#FFFFFF', fg: active ? '#FFFFFF' : '#48463F' });
return {
channels: [ch('Slack', false), ch('Meeting', false), ch('GitHub review', false), ch('Email', false), ch('In person', true)],
labels: [{ name: 'tea' }, { name: 'brewing' }],
suggested: [
{ name: 'gyokuro', tag: 'existing', style: 'suggestedExisting', border: '#B9F06A', fg: '#3D6110' },
{ name: 'kettle', tag: 'new', style: 'suggestedNew', border: '#FFB894', fg: '#B03A0A' }
]
};
}
}
</script>
</body>
</html>
