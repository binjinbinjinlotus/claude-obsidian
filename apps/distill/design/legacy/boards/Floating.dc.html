<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Distill — Floating icon states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=DM+Sans:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;font-family:"DM Sans",-apple-system,sans-serif;color:#1D1C1A;-webkit-font-smoothing:antialiased}
</style>
</helmet>
<div style="width: 760px; height: 300px; box-sizing: border-box; padding: 30px 36px; background: #F6F5F2; display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; align-items: baseline; gap: 12px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em">Floating icon</span>
<span style="font-size: 13px; color: #6B6862">Fills up as the queue grows · drag to move · click to open</span>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{states}}" as="s" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
<div style="position: relative; width: 68px; height: 68px">
<span style="position: absolute; inset: 0; border-radius: 34px; background: {{s.tile}}; box-shadow: 0 8px 20px rgba(29,28,26,0.14), 0 0 0 {{s.ringWidth}} {{s.ring}}; display: flex; align-items: center; justify-content: center">
<svg width="36" height="40" viewBox="0 0 40 44" aria-hidden="true">
<defs><clipPath id="{{s.clip}}"><path d="M15 3h10v12l11 19a5 5 0 0 1-4.3 7.5H8.3A5 5 0 0 1 4 34l11-19z"></path></clipPath></defs>
<path d="M15 3h10v12l11 19a5 5 0 0 1-4.3 7.5H8.3A5 5 0 0 1 4 34l11-19z" fill="#FFFFFF"></path>
<g clip-path="url(#{{s.clip}})"><rect x="0" y="{{s.level}}" width="40" height="44" fill="{{s.liquid}}"></rect></g>
<path d="M15 3h10v12l11 19a5 5 0 0 1-4.3 7.5H8.3A5 5 0 0 1 4 34l11-19z" fill="none" stroke="#6B7785" stroke-width="2.4" stroke-linejoin="round"></path>
<rect x="12.5" y="1" width="15" height="4" rx="2" fill="#6B7785"></rect>
</svg>
</span>
<sc-if value="{{s.hasBadge}}" hint-placeholder-val="{{ true }}">
<span style="position: absolute; top: -4px; right: -6px; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; border: 2px solid #F6F5F2; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: {{s.badgeBg}}; color: {{s.badgeFg}}">{{s.badge}}</span>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-size: 13px; font-weight: 700">{{s.title}}</span>
<span style="font-size: 12px; color: #6B6862; text-align: center">{{s.note}}</span>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":300}}'>
class Component extends DCLogic {
renderVals() {
const base = { tile: '#FFFFFF', liquid: '#B9F06A', ring: 'transparent', ringWidth: '0px', hasBadge: false };
return {
states: [
{ ...base, clip: 'f1', title: 'Empty', note: 'Nothing queued', level: '44' },
{ ...base, clip: 'f2', title: 'Queued', note: '3 files waiting', level: '28', hasBadge: true, badge: '3', badgeBg: '#E3EEFF', badgeFg: '#1F6FEB' },
{ ...base, clip: 'f3', title: 'Working', note: 'Claude is on it', level: '22', liquid: '#A9CCFF', ring: '#1F6FEB', ringWidth: '3px' },
{ ...base, clip: 'f4', title: 'Review', note: 'Needs your OK', level: '22', liquid: '#FFB894', hasBadge: true, badge: '1', badgeBg: '#B03A0A', badgeFg: '#FFFFFF' },
{ ...base, clip: 'f5', title: 'Drop', note: 'File dragged over', level: '34', tile: '#E3EEFF', ring: '#1F6FEB', ringWidth: '2px' }
]
};
}
}
</script>
</body>
</html>
