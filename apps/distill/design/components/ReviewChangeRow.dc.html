<!-- ReviewChangeRow: source template. render.py wraps it in the page shell and writes data-props from components.json.
     @@ICONS@@ and @@SETTINGS_NAV@@ are replaced with data/icons.json and data/settings_nav.json. -->
<x-dc>
<div style="width: {{w}}; display: flex; align-items: center; gap: 12px; padding: 7px 10px; border-radius: 12px; background: {{bg}}; box-sizing: border-box">
<span style="width: 22px; height: 22px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; background: {{gBg}}; color: {{gInk}}">{{glyph}}</span>
<span style="font-size: 14px; font-weight: {{fw}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; max-width: 55%">{{title}}</span>
<sc-if value="{{hasKind}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10.5px; font-weight: 700; letter-spacing: .02em; color: {{kInk}}; background: {{kBg}}; padding: 2px 7px; border-radius: 8px; white-space: nowrap; flex-shrink: 0">{{kind}}</span></sc-if>
<span style="font-size: 12px; color: #6B6862; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; min-width: 0">{{note}}</span>
<span style="font-size: 12px; color: #9B978F; white-space: nowrap; flex-shrink: 0">{{directory}}</span>
<sc-if value="{{openable}}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="Open {{title}}" style="height: 24px; padding: 0 8px; border: none; border-radius: 12px; background: transparent; color: #1F6FEB; font-size: 12px; font-weight: 600; flex-shrink: 0">Open</button></sc-if>
</div>
</x-dc>
<script type="text/x-dc-logic">
const px = (v, d) => (v === undefined || v === null || v === '') ? d : (/^[0-9.]+$/.test(String(v)) ? v + 'px' : String(v));
const isNew = (p.change || 'new') === 'new';
const K = { entity: ['#FFF4D6', '#8A5A00'], concept: ['#EFE9FF', '#5B3DB8'] }[p.kind] || ['#F6F5F2', '#6B6862'];
return { w: px(p.width, '100%'), title: p.title || 'Water temperature', note: p.note || '', directory: p.directory || 'wiki/concepts',
  glyph: isNew ? '+' : '•', gBg: isNew ? '#E9FBC9' : '#E3EEFF', gInk: isNew ? '#3D6110' : '#1F6FEB', fw: isNew ? 600 : 500,
  hasKind: !!p.kind, kind: p.kind || '', kBg: K[0], kInk: K[1], bg: on(p.hover, false) ? '#F6F5F2' : 'transparent', openable: on(p.openable, false) };
</script>
