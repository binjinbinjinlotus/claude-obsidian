<!-- FilterChip: source template. render.py wraps it in the page shell and writes data-props from components.json.
     @@ICONS@@ and @@SETTINGS_NAV@@ are replaced with data/icons.json and data/settings_nav.json. -->
<x-dc>
<span style="height: {{h}}; display: inline-flex; align-items: center; gap: 4px; padding: 0 {{padR}} 0 11px; border-radius: {{r}}; background: {{fill}}; color: {{ink}}; font-size: 12px; font-weight: 700; white-space: nowrap; box-sizing: border-box">{{text}}<sc-if value="{{removable}}" hint-placeholder-val="{{ false }}"><span style="width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 400">×</span></sc-if></span>
</x-dc>
<script type="text/x-dc-logic">
const num = (v, d) => (v === undefined || v === null || v === '' || isNaN(Number(v))) ? d : Number(v);
const h = num(p.height, 28), removable = on(p.removable, true);
return { text: p.text || '#tea', fill: p.fill || 'var(--primaryTint)', ink: p.ink || 'var(--primary)', h: h + 'px', r: h / 2 + 'px', removable, padR: removable ? '5px' : '11px' };
</script>
