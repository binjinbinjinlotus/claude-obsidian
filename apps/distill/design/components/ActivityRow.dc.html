<!-- ActivityRow: source template. render.py wraps it in the page shell and writes data-props from components.json.
     @@ICONS@@ and @@SETTINGS_NAV@@ are replaced with data/icons.json and data/settings_nav.json. -->
<x-dc>
<div style="width: {{w}}; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 8px; border-radius: 10px; background: {{bg}}; box-shadow: {{ring}}; box-sizing: border-box">
<span style="width: 24px; height: 24px; border-radius: 7px; background: {{tBg}}; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{tInk}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tD}}"></path></svg></span>
<span style="flex-grow: 1; min-width: 0; font-size: 13px; color: #1D1C1A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{summary}}</span>
<sc-if value="{{failed}}" hint-placeholder-val="{{ false }}"><dc-import name="Pill" text="Failed" fill="#FFE4D6" ink="#B03A0A" size="small" hint-size="56px,20px"></dc-import></sc-if>
<sc-if value="{{hasTag}}" hint-placeholder-val="{{ false }}"><span style="flex-shrink: 0; font-size: 11px; font-weight: 600; color: {{tagInk}}; padding: 2px 7px; border-radius: 9px; background: {{tagBg}}">{{tag}}</span></sc-if>
<span style="flex-shrink: 0; font-size: 11.5px; color: #9B978F; font-variant-numeric: tabular-nums; white-space: nowrap">{{meta}}</span>
</div>
</x-dc>
<script type="text/x-dc-logic">
const px = (v, d) => (v === undefined || v === null || v === '') ? d : (/^[0-9.]+$/.test(String(v)) ? v + 'px' : String(v));
const D = {"chat": "M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z", "collector": "M12 3v9M8 8.5l4 4 4-4M4 15.5v3A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5v-3", "action": "M9 6h11M9 12h11M9 18h11M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17", "batch": "M9 11l3 3 8-8M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9", "queue": "M22 12h-6l-2 3h-4l-2-3H2M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z", "note": "M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5", "connection": "M10 13a5 5 0 0 0 7.1 0l3-3a5 5 0 0 0-7.1-7.1l-1 1M14 11a5 5 0 0 0-7.1 0l-3 3a5 5 0 0 0 7.1 7.1l1-1", "settings": "M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6", "runner": "M15 7a4 4 0 1 1-3.9 4.9L3 20v-3l2-2h2v-2h2l2.1-2.1A4 4 0 0 1 15 7zM16 9h.01"};
const failed = p.outcome === 'failed', sel = on(p.selected, false), hover = on(p.hover, false);
const tag = p.tag || '';
const T = {"In trash": ["#F6F5F2", "#6B6862"], "Restored": ["#F3FDE4", "#3D6110"]};
const t = T[tag] || T["In trash"];
const meta = [p.time || '7:04 PM', p.source || 'Mac app'].filter(Boolean).join(' · ');
return { w: px(p.width, '100%'), tD: D[p.family] || D.collector, tBg: failed ? '#FFE4D6' : '#F6F5F2', tInk: failed ? '#B03A0A' : '#6B6862',
  summary: p.summary || 'Deleted the script collector “Meeting notes”', failed, hasTag: !!tag && !failed, tag, tagBg: t[0], tagInk: t[1], meta,
  bg: sel ? '#F2F7FF' : hover ? '#F6F5F2' : 'transparent', ring: sel ? 'inset 0 0 0 1.5px #BFD5FA' : 'none' };
</script>
