<!-- ScheduleField: source template. render.py wraps it in the page shell and writes data-props from components.json.
     @@ICONS@@ and @@SETTINGS_NAV@@ are replaced with data/icons.json and data/settings_nav.json. -->
<x-dc>
<div style="width: {{w}}; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<dc-import name="DropdownButton" title="{{presetTitle}}" width="150" height="30" system-image="clock" active="{{menuOpen}}" hint-size="150px,30px"></dc-import>
<sc-if value="{{hasTime}}" hint-placeholder-val="{{ true }}"><span style="font-size: 12px; color: #6B6862">at</span><span style="height: 30px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 10px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #ECEAE5; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums">{{time}}</span></sc-if>
<sc-if value="{{hasEvery}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #6B6862">{{every}}</span></sc-if>
</div>
<div style="display: flex; align-items: center; gap: 8px; min-width: 0">
<span style="font-size: 10px; font-weight: 800; letter-spacing: .06em; color: #9B978F; flex-shrink: 0">CRON</span>
<span style="height: 28px; min-width: 120px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 8px; background: {{cronBg}}; box-shadow: inset 0 0 0 {{cronRingW}} {{cronRing}}; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; color: {{cronInk}}; white-space: nowrap; flex-shrink: 0">{{cron}}</span>
<span style="font-size: 12px; color: {{previewInk}}; line-height: 1.4; min-width: 0"><b style="font-weight: 600; color: {{boldInk}}">{{preview}}</b>{{rest}}</span>
</div>
</div>
</x-dc>
<script type="text/x-dc-logic">
const px = (v, d) => (v === undefined || v === null || v === '') ? d : (/^[0-9.]+$/.test(String(v)) ? v + 'px' : String(v));
const P = {"15min": ["Every 15 minutes", false, "*/15 * * * *"], "hourly": ["Every hour", false, "0 * * * *"], "daily": ["Every day", true, "0 9 * * *"], "weekdays": ["Weekdays", true, "0 9 * * 1-5"], "custom": ["Custom (cron)", false, "30 8 * * 1,3,5"]};
const pr = P[p.preset] || P.hourly, custom = p.preset === 'custom', bad = on(p.invalid, false);
const preview = p.preview || 'Every hour, on the hour';
const next = p.next || 'next at 10:00 AM';
return { w: px(p.width, '100%'), presetTitle: pr[0], hasTime: pr[1], time: p.time || '9:00 AM', menuOpen: on(p.menuOpen, false),
  hasEvery: !pr[1] && !custom, every: p.preset === '15min' ? 'starting on the hour' : 'on the hour',
  cron: p.cron || pr[2], cronBg: custom ? '#FFFFFF' : '#F6F5F2', cronInk: custom ? '#1D1C1A' : '#6B6862',
  cronRing: bad ? '#FF9A6B' : custom ? '#BFD5FA' : '#ECEAE5', cronRingW: bad || custom ? '1.5px' : '1px',
  previewInk: bad ? '#B03A0A' : '#48463F',
  boldInk: bad ? '#B03A0A' : '#1D1C1A',
  preview: bad ? (p.preview || 'Not a schedule') : preview, rest: bad ? ' · ' + (p.next || 'use 5 fields: minute hour day month weekday') : ' · ' + next };
</script>
