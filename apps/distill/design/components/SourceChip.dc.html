     @@ICONS@@ and @@SETTINGS_NAV@@ are replaced with data/icons.json and data/settings_nav.json. -->
<x-dc>
<span style="height: 26px; display: inline-flex; align-items: center; gap: 4px; padding: 0 10px; border-radius: 13px; background: var(--window); box-shadow: inset 0 0 0 1px var(--border); color: var(--ink); font-size: 12px; font-weight: 600; white-space: nowrap; box-sizing: border-box">{{label}}<sc-if value="{{hovering}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 400; color: var(--faint)">×</span></sc-if></span>
</x-dc>
<script type="text/x-dc-logic">
return { label: p.label || 'Slack', hovering: on(p.hovering, false) };
</script>
