<!-- QueuePath: source template. render.py wraps it in the page shell and writes data-props from components.json.
     @@ICONS@@ and @@SETTINGS_NAV@@ are replaced with data/icons.json and data/settings_nav.json. -->
<x-dc>
<div title="{{tip}}" style="width: {{w}}; display: flex; align-items: center; gap: 6px; min-width: 0; box-sizing: border-box">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; stroke: {{iconInk}}"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"></path></svg>
<sc-if value="{{hasLabel}}" hint-placeholder-val="{{ false }}"><span style="font-size: {{fs}}; color: var(--faint); flex-shrink: 0">{{label}}</span></sc-if>
<span style="font-size: {{fs}}; color: {{pathInk}}; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; padding: 1px 4px; border-radius: 5px; background: {{pathBg}}; text-decoration: {{strike}}">{{path}}</span>
<sc-if value="{{missing}}" hint-placeholder-val="{{ false }}"><span style="font-size: {{fs}}; color: var(--peachInk); font-weight: 600; white-space: nowrap; flex-shrink: 0">is missing</span><span role="button" style="height: 26px; display: inline-flex; align-items: center; padding: 0 8px; color: var(--primary); font-size: {{fs}}; font-weight: 600; white-space: nowrap; flex-shrink: 0">Create folder</span></sc-if>
<sc-if value="{{present}}" hint-placeholder-val="{{ true }}"><span style="display: inline-flex; align-items: center; gap: 0; flex-shrink: 0">
<span role="button" title="{{copyHelp}}" style="height: 26px; display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: 13px; background: {{copyBg}}; color: {{copyInk}}; font-size: {{fs}}; font-weight: 600; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: {{copyInk}}"><path d="{{copyD}}"></path></svg>{{copyTitle}}</span>
<span role="button" title="Show the folder in Finder" style="height: 26px; display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; color: var(--primary); font-size: {{fs}}; font-weight: 600; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--primary)"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>{{revealTitle}}</span>
</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc-logic">
const px = (v, d) => (v === undefined || v === null || v === '') ? d : (/^[0-9.]+$/.test(String(v)) ? v + 'px' : String(v));
const st = p.state || 'default', compact = p.size === 'compact';
const copied = st === 'copied', missing = st === 'missing', hover = st === 'hover';
const path = p.path || '~/Documents/Distill Queue/Research';
const full = path.replace(/^~/, '/Users/mei');
return { w: px(p.width, 'auto'), path, tip: full, fs: compact ? '12px' : '12.5px',
  hasLabel: !!p.label, label: p.label || '',
  iconInk: missing ? 'var(--peachInk)' : 'var(--faint)', pathInk: missing ? 'var(--peachInk)' : '#48463F', pathBg: hover ? '#EFEDE8' : 'transparent', strike: 'none',
  missing, present: !missing,
  copyTitle: copied ? 'Copied' : (compact ? 'Copy' : 'Copy path'), copyHelp: 'Copy ' + full,
  copyInk: copied ? 'var(--limeInk)' : 'var(--primary)', copyBg: copied ? '#F3FDE4' : 'transparent',
  copyD: copied ? 'M5 12.5l4.5 4.5L19 7.5' : 'M8 8h11v12H8zM5 16V4h11',
  revealTitle: compact ? 'Reveal' : 'Reveal in Finder' };
</script>
