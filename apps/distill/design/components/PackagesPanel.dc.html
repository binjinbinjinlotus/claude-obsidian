<!-- PackagesPanel: source template. render.py wraps it in the page shell and writes data-props from components.json.
     @@ICONS@@ and @@SETTINGS_NAV@@ are replaced with data/icons.json and data/settings_nav.json. -->
<x-dc>
<div style="width: {{w}}; display: flex; flex-direction: column; gap: 8px; min-width: 0; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 8px; min-width: 0">
<span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11.5px; font-weight: 600; color: #1D1C1A; padding: 2px 6px; border-radius: 6px; background: #F6F5F2; flex-shrink: 0">{{manifest}}</span>
<sc-if value="{{spin}}" hint-placeholder-val="{{ false }}"><span style="width: 11px; height: 11px; box-sizing: border-box; border-radius: 50%; border: 2px solid #D6E4FB; border-top-color: #1F6FEB; flex-shrink: 0"></span></sc-if>
<span style="font-size: 12px; color: {{statusInk}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex-grow: 1">{{status}}</span>
<sc-if value="{{showInstall}}" hint-placeholder-val="{{ true }}"><dc-import name="SoftButton" title="Install" tint="#1D1C1A" fill="#FFFFFF" stroke="#ECEAE5" system-image="square.and.arrow.down" size="small" enabled="{{installEnabled}}" hint-size="90px,30px"></dc-import></sc-if>
<sc-if value="{{spin}}" hint-placeholder-val="{{ false }}"><dc-import name="SoftButton" title="Stop" tint="#1D1C1A" fill="#FFFFFF" stroke="#ECEAE5" system-image="xmark" size="small" hint-size="72px,30px"></dc-import></sc-if>
<dc-import name="IconButton" system-image="ellipsis" help="Clean reinstall, Open in editor" hint-size="26px,26px"></dc-import>
</div>
<div style="display: flex; flex-direction: column; padding: 10px 12px; border-radius: 10px; background: #FFFFFF; box-shadow: {{boxRing}}; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11.5px; line-height: 1.6; overflow: hidden">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="4"><div style="display: flex; gap: 12px; min-width: 0; background: {{l.bg}}; margin: 0 -12px; padding: 0 12px"><span style="width: 16px; flex-shrink: 0; text-align: right; color: #C2BEB6">{{l.n}}</span><span style="white-space: pre; color: {{l.ink}}; overflow: hidden; text-overflow: ellipsis; min-width: 0">{{l.t}}</span></div></sc-for>
</div>
<sc-if value="{{showOutput}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 6px"><span style="font-size: 10px; font-weight: 800; letter-spacing: .06em; color: {{outHeadInk}}">{{outHead}}</span><span style="flex-grow: 1"></span><span role="button" style="font-size: 11px; font-weight: 600; color: #1F6FEB">Copy output</span></div>
<div style="padding: 8px 10px; border-radius: 8px; background: #1F1E1C; display: flex; flex-direction: column; gap: 1px">
<sc-for list="{{out}}" as="o" hint-placeholder-count="3"><span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; line-height: 1.5; color: {{o.ink}}; white-space: pre-wrap; word-break: break-all">{{o.t}}</span></sc-for>
</div></div></sc-if>
<span style="font-size: 11.5px; color: #9B978F; line-height: 1.45">{{hint}}</span>
</div>
</x-dc>
<script type="text/x-dc-logic">
const px = (v, d) => (v === undefined || v === null || v === '') ? d : (/^[0-9.]+$/.test(String(v)) ? v + 'px' : String(v));
const py = p.manifest === 'requirements.txt', st = p.state || 'installed';
const defLines = py ? 'requests>=2.32|google-api-python-client|keyring' : '{|  "type": "module",|  "dependencies": {|    "date-fns": "^4.1.0",|+    "@slack/web-api": "^7.8.0"|  }|}';
const defOut = py ? '$ python3 -m venv .venv|$ .venv/bin/pip install -r requirements.txt|Collecting requests>=2.32|Successfully installed certifi-2025.8.3 requests-2.32.5 …'
  : '$ npm install|added 12 packages in 3s';
const failOut = py ? '$ .venv/bin/pip install -r requirements.txt|!ERROR: Could not find a version that satisfies the requirement google-api-python-clint|!ERROR: No matching distribution found for google-api-python-clint'
  : '$ npm install|!npm error 404 Not Found - GET https://registry.npmjs.org/@slack%2fweb-apii|!npm error 404 \'@slack/web-apii@^7.8.0\' is not in this registry.';
const raw = (p.lines || (st === 'none' ? '' : defLines)).split('|').filter((t) => t !== '');
const lines = raw.length ? raw.map((t, i) => { const add = t.startsWith('+'); return { n: i + 1, t: add ? t.slice(1) : t, bg: add ? '#F3FDE4' : 'transparent', ink: '#1D1C1A' }; })
  : [{ n: 1, t: py ? '# one package per line, e.g. requests>=2.32' : '{ "dependencies": {} }', bg: 'transparent', ink: '#9B978F' }];
const outRaw = (p.output || (st === 'failed' ? failOut : defOut)).split('|').filter(Boolean);
const out = outRaw.map((t) => ({ t: t.replace(/^!/, ''), ink: t.startsWith('!') ? '#FFB894' : '#E8E6E1' }));
const S = {
  none: ['No packages. Add one to install it into this folder.', '#6B6862'],
  installed: [py ? '3 packages installed · Oct 3 at 9:12 AM' : '2 packages installed · Oct 3 at 9:12 AM', '#3D6110'],
  pending: [p.manifest + ' changed · installs before the next run', '#1D1C1A'],
  installing: ['Installing… 14 s', '#1F6FEB'],
  failed: ['Install failed · exit 1 · the collector waits', '#B03A0A'],
  needsOK: ['Changed · waits for your OK before it installs', '#8A5A00'] };
const s = S[st] || S.installed;
const hint = st === 'needsOK' ? 'Installing runs code from the package’s authors, so a change to ' + p.manifest + ' asks first, like the script.'
  : py ? 'Installed with pip into .venv/ in the collector’s folder; the script runs with that Python.'
  : 'Installed with npm into node_modules/ in the collector’s folder.';
return { w: px(p.width, '100%'), manifest: p.manifest || 'package.json', status: p.summary || s[0], statusInk: s[1],
  spin: st === 'installing', showInstall: st !== 'installing', installEnabled: st === 'needsOK' || st === 'none' ? 'false' : 'true',
  boxRing: st === 'needsOK' ? 'inset 0 0 0 1px #F5D98B' : 'inset 0 0 0 1px #ECEAE5', lines,
  showOutput: st === 'installing' || st === 'failed' || on(p.expanded, false), out,
  outHead: st === 'failed' ? 'INSTALL OUTPUT · STDERR' : 'INSTALL OUTPUT', outHeadInk: st === 'failed' ? '#B03A0A' : '#9B978F', hint };
</script>
