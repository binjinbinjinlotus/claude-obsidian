<!-- LogLine: source template. render.py wraps it in the page shell and writes data-props from components.json.
     @@ICONS@@ and @@SETTINGS_NAV@@ are replaced with data/icons.json and data/settings_nav.json. -->
<x-dc>
<div style="width: {{w}}; display: flex; flex-direction: column; gap: 3px; padding: {{pad}}; border-radius: 8px; background: {{bg}}; box-sizing: border-box">
<sc-if value="{{isPhase}}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; gap: 8px; min-width: 0"><span style="font-size: 10px; font-weight: 800; letter-spacing: .06em; color: var(--faint); white-space: nowrap">{{text}}</span><span style="flex-grow: 1; height: 1px; background: var(--border)"></span><span style="font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap">{{time}}</span></div></sc-if>
<sc-if value="{{isOutput}}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: 8px; min-width: 0"><span style="width: 3px; flex-shrink: 0; border-radius: 2px; background: {{gutter}}"></span><span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11.5px; line-height: 1.55; color: {{outInk}}; white-space: pre-wrap; word-break: break-all; min-width: 0; flex-grow: 1">{{text}}</span><sc-if value="{{hasTime}}" hint-placeholder-val="{{ false }}"><span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10.5px; line-height: 1.6; color: #7C7870; white-space: nowrap; flex-shrink: 0">{{time}}</span></sc-if></div></sc-if>
<sc-if value="{{isRow}}" hint-placeholder-val="{{ true }}"><div style="display: flex; align-items: flex-start; gap: 10px; min-width: 0">
<span style="width: 18px; height: 18px; margin-top: 1px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0"><sc-if value="{{spin}}" hint-placeholder-val="{{ false }}"><span style="width: 11px; height: 11px; box-sizing: border-box; border-radius: 50%; border: 2px solid #D6E4FB; border-top-color: var(--primary)"></span></sc-if><sc-if value="{{still}}" hint-placeholder-val="{{ true }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="{{dotW}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: {{dotInk}}"><path d="{{dotD}}"></path></svg></sc-if></span>
<span style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1; min-width: 0">
<span style="font-size: {{fs}}; line-height: 1.45; color: {{textInk}}; font-style: {{textStyle}}; {{clip}}">{{text}}<sc-if value="{{hasCount}}" hint-placeholder-val="{{ false }}"><span style="color: var(--faint)"> · {{count}}</span></sc-if></span>
<sc-if value="{{hasBar}}" hint-placeholder-val="{{ false }}"><span style="display: block; width: 180px; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden"><span style="display: block; width: {{barW}}; height: 4px; border-radius: 2px; background: var(--primary)"></span></span></sc-if>
<sc-if value="{{showDetail}}" hint-placeholder-val="{{ false }}"><span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; line-height: 1.5; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{detail}}</span></sc-if>
</span>
<sc-if value="{{expandable}}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 4px; stroke: var(--faint)"><path d="{{chev}}"></path></svg></sc-if>
<span style="font-size: 11px; line-height: 1.8; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0; min-width: 52px; text-align: right">{{time}}</span>
</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc-logic">
const px = (v, d) => (v === undefined || v === null || v === '') ? d : (/^[0-9.]+$/.test(String(v)) ? v + 'px' : String(v));
const kind = p.kind || 'step', state = p.state || 'done', exp = on(p.expanded, false);
const S = {"done": ["var(--limeInk)", "M5 12.5l4.5 4.5L19 7.5", "2.6"], "waiting": ["#C9C5BD", "M12 12m-6 0a6 6 0 1 0 12 0a6 6 0 1 0-12 0", "2"], "failed": ["var(--peachInk)", "M12 6v8M12 18h.01", "2.8"], "review": ["var(--peachInk)", "M12 12m-6 0a6 6 0 1 0 12 0a6 6 0 1 0-12 0M12 9v3l2 1.5", "2"], "note": ["var(--faint)", "M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z", "2"]};
const s = kind === 'note' ? S.note : (S[state] || S.done);
const isRow = kind !== 'phase' && kind !== 'output';
const count = p.count || '', prog = String(p.progress || '');
const m = prog.match(/^(\d+)\/(\d+)$/);
const stream = p.stream || 'stdout';
const G = {"stdout": "transparent", "stderr": "#FF9A6B", "cmd": "transparent", "system": "transparent"};
const O = {"stdout": "#E8E6E1", "stderr": "var(--peach)", "cmd": "var(--faint)", "system": "var(--faint)"};
return { w: px(p.width, '100%'), isPhase: kind === 'phase', isOutput: kind === 'output', isRow,
  pad: kind === 'output' ? '0 4px' : kind === 'phase' ? '14px 8px 6px' : (String(p.level || '0') === '1' ? '4px 8px 4px 36px' : '6px 8px'),
  bg: isRow && exp ? 'var(--panel)' : 'transparent',
  text: p.text || 'Read “AI FE Platform Sync · Sep 29”', time: p.time || '', hasTime: !!p.time,
  spin: isRow && state === 'running' && kind !== 'note', still: !(isRow && state === 'running' && kind !== 'note'),
  dotInk: s[0], dotD: s[1], dotW: s[2],
  textInk: kind === 'note' ? '#48463F' : state === 'failed' ? 'var(--peachInk)' : state === 'waiting' ? 'var(--faint)' : 'var(--ink)',
  textStyle: kind === 'note' ? 'italic' : 'normal', fs: String(p.level || '0') === '1' ? '12.5px' : '13px',
  clip: kind === 'note' ? '' : 'white-space: nowrap; overflow: hidden; text-overflow: ellipsis;',
  hasCount: !!count, count, hasBar: !!m && state === 'running', barW: m ? Math.round(100 * Number(m[1]) / Math.max(1, Number(m[2]))) + '%' : '0%',
  showDetail: on(p.showDetail, false) && !!p.detail, detail: p.detail || '',
  expandable: kind === 'group', chev: exp ? 'M6 9l6 6 6-6' : 'M9 6l6 6-6 6',
  gutter: G[stream] || G.stdout, outInk: O[stream] || O.stdout };
</script>
