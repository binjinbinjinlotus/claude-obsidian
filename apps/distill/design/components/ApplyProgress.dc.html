<!-- ApplyProgress: source template. render.py wraps it in the page shell and writes data-props from components.json.
     @@ICONS@@ and @@SETTINGS_NAV@@ are replaced with data/icons.json and data/settings_nav.json. -->
<x-dc>
<section aria-label="{{heading}}" style="width: {{w}}; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: {{pad}}; border-radius: 16px; background: {{bg}}; box-shadow: inset 0 0 0 1px {{ring}}">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 6px">
<span style="font-size: 14px; font-weight: 700; color: {{headInk}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">{{heading}}</span>
<sc-if value="{{hasPart}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: var(--muted); white-space: nowrap">{{part}}</span></sc-if>
<span style="flex-grow: 1"></span>
<a href="#" style="font-size: 12px; font-weight: 600; text-decoration: none; white-space: nowrap">Show steps</a>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5"><dc-import name="LogLine" kind="step" state="{{r.state}}" text="{{r.text}}" count="{{r.count}}" time="{{r.time}}" hint-size="100%,32px"></dc-import></sc-for>
<sc-if value="{{hasHelp}}" hint-placeholder-val="{{ false }}"><p style="margin: 4px 8px 4px 36px; font-size: 12px; line-height: 1.5; color: #48463F">{{help}}</p></sc-if>
</section>
</x-dc>
<script type="text/x-dc-logic">
const px = (v, d) => (v === undefined || v === null || v === '') ? d : (/^[0-9.]+$/.test(String(v)) ? v + 'px' : String(v));
// stage: the step running now (done = every step finished). failedAt: the step that failed, if any.
const order = ['approved', 'starting', 'applying', 'applied', 'finding', 'done'];
const core = on(p.core, false), folded = on(p.folded, false);
const stage = p.stage || 'starting', failedAt = p.failedAt || 'none';
const runner = p.runner || 'Claude', vault = p.vault || 'Research';
const sources = p.sources || '22 sources', changes = p.changes || '31 changes';
const added = p.added || '22 source pages, 3 concepts, 1 entity added · 6 pages updated';
const actions = p.actions || 'Found 5 actions to confirm';
const times = String(p.times || '').split('|');
const at = order.indexOf(failedAt !== 'none' ? failedAt : stage);
const W = {
  approved: ['You approved', 'You approved', sources],
  starting: [runner + ' is starting: resuming this batch’s session', runner + ' resumed this batch’s session', ''],
  applying: ['Applying ' + changes + ' through the vault core', 'Applied through the vault core', p.operation || ''],
  applied: ['Add to ' + vault, 'Added to ' + vault + ': ' + added, ''],
  finding: ['Finding actions in these notes', actions, ''],
};
const steps = ['approved', 'starting', 'applying', 'applied', 'finding'].filter((k) => !(core && k === 'starting'));
const last = (failedAt === 'finding' ? (p.error || '') : stage === 'done' ? actions : '');
const rows = steps.map((k, i) => {
  const n = order.indexOf(k);
  const failed = failedAt === k;
  const state = failed ? (k === 'finding' ? 'waiting' : 'failed') : n < at || stage === 'done' ? 'done' : n === at ? (k === 'applied' ? 'done' : 'running') : 'waiting';
  const text = failed ? (p.error || 'Failed') : state === 'done' ? W[k][1] : W[k][0];
  return { state, text, count: state === 'done' || k === 'approved' ? W[k][2] : '', time: state === 'waiting' ? '' : (times[i] || '') };
});
const failed = failedAt !== 'none' && failedAt !== 'finding';
const done = !failed && (stage === 'finding' || stage === 'done' || stage === 'applied');
const heading = p.heading || (failed ? 'Not added to your vault' : done ? 'Added to ' + vault : 'Adding to ' + vault + '…');
const summary = folded ? [p.part || '', 'All ' + steps.length + ' steps done', last].filter(Boolean).join(' · ') : (p.part || '');
return { w: px(p.width, '100%'), rows: folded ? [] : rows, heading, part: summary, hasPart: !!summary,
  headInk: failed ? 'var(--peachInk)' : done ? 'var(--limeInk)' : 'var(--ink)',
  bg: failed ? '#FFF8F4' : '#FBFAF8', ring: failed ? 'var(--peachTint)' : 'var(--border)',
  help: p.help || '', hasHelp: !!p.help && !folded, pad: folded ? '12px 10px 6px' : '12px 10px 8px' };
</script>
