<!-- Tile: source template. render.py wraps it in the page shell and writes data-props from components.json.
     @@ICONS@@ and @@SETTINGS_NAV@@ are replaced with data/icons.json and data/settings_nav.json. -->
<x-dc>
<span style="width: {{s}}; height: {{s}}; border-radius: {{r}}; background: {{fill}}; color: {{ink}}; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: {{family}}; font-size: {{fs}}; font-weight: {{fw}}">{{text}}</span>
</x-dc>
<script type="text/x-dc-logic">
const num = (v, d) => (v === undefined || v === null || v === '' || isNaN(Number(v))) ? d : Number(v);
const s = num(p.size, 40), display = on(p.display, false);
return { text: p.text || 'NOTE', fill: p.fill || 'var(--limeTint)', ink: p.ink || 'var(--limeInk)', s: s + 'px', r: (s * 0.3) + 'px',
  family: display ? "'Bricolage Grotesque', sans-serif" : "'DM Sans', sans-serif", fs: display ? (s * 0.42) + 'px' : '10px', fw: display ? 800 : 700 };
</script>
