<!-- ReviewSourceRow: source template. render.py wraps it in the page shell and writes data-props from components.json.
     @@ICONS@@ and @@SETTINGS_NAV@@ are replaced with data/icons.json and data/settings_nav.json. -->
<x-dc>
<div style="width: {{w}}; display: flex; align-items: flex-start; gap: 12px; padding: 9px 10px; border-radius: 12px; background: {{bg}}; opacity: {{op}}; box-sizing: border-box">
<sc-if value="{{selectable}}" hint-placeholder-val="{{ false }}"><span role="checkbox" aria-checked="{{checked}}" style="width: 18px; height: 18px; margin-top: 3px; border-radius: 5px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; background: {{boxBg}}; box-shadow: {{boxRing}}"><sc-if value="{{isChecked}}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--window)"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span></sc-if>
<sc-if value="{{showGlyph}}" hint-placeholder-val="{{ true }}"><span style="width: 22px; height: 22px; margin-top: 1px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; background: var(--limeTint); color: var(--limeInk)">+</span></sc-if>
<span style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1; min-width: 0">
<span style="display: flex; align-items: baseline; gap: 8px; min-width: 0"><span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; max-width: 60%; text-decoration: {{strike}}">{{title}}</span><span style="font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">from {{file}}</span></span>
<sc-if value="{{showLabels}}" hint-placeholder-val="{{ true }}"><dc-import name="LabelLine" labels="{{labels}}" state="{{labelState}}" lead="{{lead}}" action="{{action}}" quiet="{{quiet}}" hint-size="100%,26px"></dc-import></sc-if>
<sc-if value="{{removed}}" hint-placeholder-val="{{ false }}"><span style="min-height: 26px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted)">Removed from this batch: it won’t be added to the vault. The file stays in inbox/.<button type="button" style="height: 24px; padding: 0 6px; border: none; background: transparent; color: var(--primary); font-size: 12px; font-weight: 600">Undo</button></span></sc-if>
</span>
<sc-if value="{{showActions}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 12px; margin-top: 2px; white-space: nowrap"><span style="font-size: 12px; font-weight: 600; color: var(--primary)">Open page</span><span style="font-size: 12px; font-weight: 600; color: var(--peachInk)">Remove</span></span></sc-if>
</div>
</x-dc>
<script type="text/x-dc-logic">
const px = (v, d) => (v === undefined || v === null || v === '') ? d : (/^[0-9.]+$/.test(String(v)) ? v + 'px' : String(v));
const state = p.labelState || 'suggested';
const hover = on(p.hover, false), editing = state === 'editing', removed = on(p.removed, false);
const selectable = on(p.selectable, false) && !removed, checked = on(p.selected, true);
// In Review a row stays quiet (no ×, no + Add): Approve confirms the labels shown; hover offers Edit, Open page and Remove.
const action = { suggested: 'Edit', confirmed: 'Edit', own: 'Edit', none: '+ Add' }[state] || '-';
return { w: px(p.width, '100%'), title: p.title || 'Tea club sync · Sep 28', file: p.file || 'tea-club-sync-2026-09-28.md',
  labels: p.labels || '', labelState: state, lead: state === 'suggested' ? '-' : '', action: (hover || editing) && !removed ? action : '-',
  quiet: hover || editing ? 'false' : 'true', bg: editing ? '#F2F7FF' : (hover && !removed ? 'var(--panel)' : 'transparent'),
  showActions: hover && !editing && !removed, removed, showLabels: !removed, op: removed ? 0.72 : 1, strike: removed ? 'line-through' : 'none',
  selectable, checked: checked ? 'true' : 'false', isChecked: checked, showGlyph: !selectable,
  boxBg: checked ? 'var(--primary)' : 'var(--window)', boxRing: checked ? 'none' : 'inset 0 0 0 1.5px #B5B1A9' };
</script>
